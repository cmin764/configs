name: config checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Environment parity check (this workflow targets Apple Silicon)
        run: |
          sw_vers -productVersion
          uname -m
          [ "$(uname -m)" = "arm64" ] || { echo "runner is not arm64, macos-latest may have moved"; exit 1; }

      - name: Lint Python (ruff, pinned), shell tests (shellcheck), workflow (actionlint)
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet ruff==0.16.10
          "$RUNNER_TEMP/lint/bin/ruff" check .
          "$RUNNER_TEMP/lint/bin/ruff" format --check .
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck -S warning .github/scripts/*.sh
          command -v actionlint >/dev/null || brew install actionlint
          actionlint .github/workflows/*.yml

      - name: Run selftest (verify the checker itself works)
        run: python3 .github/scripts/check_configs.py --selftest

      - name: Secrets, JSON/shell validity, machine-specific paths, junk files
        run: python3 .github/scripts/check_configs.py

      - name: config-sync selftest (deep_merge / diff_paths / claude-mem isolation logic)
        run: python3 .claude/skills/config-sync/scripts/sync.py --selftest

      - name: iTerm2 profile sync end to end (throwaway HOME and git repo, synthetic plist)
        run: bash .github/scripts/test_iterm2_sync.sh

      - name: claude-mem-pid-guard hook (shimmed security/curl, every leak state)
        run: bash .github/scripts/test_claude_mem_pid_guard.sh

      - name: sync.py --new-profile end to end (throwaway HOME, shimmed claude)
        run: bash .github/scripts/test_new_profile.sh
